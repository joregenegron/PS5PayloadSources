name: Update Payloads

on:
schedule:
- cron: "17 */6 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
update-payloads:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Update payloads
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      python3 <<'PY'
      import json
      import subprocess
      import urllib.request
      from urllib.parse import urlparse

      FILE = "payloads.json"

      def github_api(url):
          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "PS5PayloadSources-Updater"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              return json.load(response)

      def github_repo(source):
          parsed = urlparse(source)
          parts = parsed.path.strip("/").split("/")

          if len(parts) < 2:
              return None

          return f"{parts[0]}/{parts[1]}"

      with open(FILE, "r", encoding="utf-8") as f:
          data = json.load(f)

      changed = False

      for payload in data.get("payloads", []):

          source = payload.get("source")
          filename = payload.get("filename")

          if not source or not filename:
              print(
                  f"Skipping {payload.get('name', 'unknown')}: "
                  "missing source or filename"
              )
              continue

          repo = github_repo(source)

          if not repo:
              print(
                  f"Skipping {payload.get('name', 'unknown')}: "
                  "invalid GitHub source"
              )
              continue

          print(f"\nChecking {payload.get('name', 'unknown')}")
          print(f"Repository: {repo}")
          print(f"Filename: {filename}")

          try:
              release = github_api(
                  f"https://api.github.com/repos/{repo}/releases/latest"
              )
          except Exception as e:
              print(f"Could not get latest release: {e}")
              continue

          tag = release.get("tag_name")

          if not tag:
              print("No release tag found.")
              continue

          matching_assets = [
              asset
              for asset in release.get("assets", [])
              if asset.get("name") == filename
          ]

          if len(matching_assets) != 1:
              print(
                  f"Skipping: expected exactly one asset named "
                  f"{filename}, found {len(matching_assets)}"
              )
              continue

          asset = matching_assets[0]
          new_url = asset["browser_download_url"]

          old_version = payload.get("version")
          old_url = payload.get("url")

          if old_version == tag and old_url == new_url:
              print("Already up to date.")
              continue

          print(f"Updating {old_version} -> {tag}")

          payload["version"] = tag
          payload["url"] = new_url

          changed = True

      if changed:
          with open(FILE, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print("\nPayload catalog updated.")
      else:
          print("\nNo changes required.")
      PY

  - name: Commit changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add payloads.json

      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi

      git commit -m "Update payload versions"
      git push
